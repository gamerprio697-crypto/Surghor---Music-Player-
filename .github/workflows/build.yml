name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7 }
      - name: Arrange files
        run: |
          mkdir -p app/src/main/java/com/example/musicplayer app/src/main/res/mipmap-xxxhdpi
          cp app-build.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp ic_launcher.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp PlaybackService.kt Songs.kt MainActivity.kt app/src/main/java/com/example/musicplayer/
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MusicPlayer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
